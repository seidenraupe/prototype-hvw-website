# Soft-Launch: deploy/hostpoint-soft-launch → Hostpoint (www.hvwinterthur.ch)
# Interne Vorschau: deploy/hostpoint-vorschau → /vorschau/ (HTTP-Passwort)
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY  – kompletter privater Key (inkl. -----BEGIN … PRIVATE KEY-----)
#   SSH_HOST         – Hostname OHNE Protokoll, z. B. www.hvwinterthur.ch
#                      oder der Server-Hostname aus dem Hostpoint Control Panel
#                      (… .hostpoint.ch). Nicht: sftp://…, ftp://…, Pfade
#   SSH_USER         – SSH-/FTP-Benutzername bei Hostpoint
#   SSH_TARGET_DIR   – Document Root, z. B. /home/BENUTZER/www/hvwinterthur.ch/
#                      (mit abschliessendem /)
#
# Optional für die interne Vorschau (sonst Standard-Zugang, siehe README):
#   VORSCHAU_BASIC_USER
#   VORSCHAU_BASIC_PASSWORD
#
# Hostpoint: SSH muss im Control Panel aktiviert und der öffentliche Key
# unter authorized_keys hinterlegt sein.

name: Deploy via rsync

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostpoint-soft-launch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Halbjahresprogramm-PDF erzeugen
        env:
          EVENTFROG_API_KEY: ${{ secrets.EVENTFROG_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${EVENTFROG_API_KEY:-}" ]; then
            echo "::warning::EVENTFROG_API_KEY fehlt — vorhandenes PDF im Repo wird verwendet (falls vorhanden)."
          else
            python3 -m pip install -r scripts/requirements-pdf.txt
            python3 scripts/generate-halbjahresprogramm-pdf.py -o programm/HalbJahresprogramm.pdf
          fi
          if [ ! -f programm/HalbJahresprogramm.pdf ]; then
            echo "::error::programm/HalbJahresprogramm.pdf fehlt und konnte nicht erzeugt werden."
            exit 1
          fi

      - name: Soft-Launch-Paket bauen
        run: ./scripts/build-hostpoint-soft-launch.sh

      - name: Interne Vorschau bauen
        env:
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
          VORSCHAU_BASIC_USER: ${{ secrets.VORSCHAU_BASIC_USER }}
          VORSCHAU_BASIC_PASSWORD: ${{ secrets.VORSCHAU_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          target="${SSH_TARGET_DIR:-}"
          case "$target" in
            */) ;;
            *) target="${target}/" ;;
          esac
          if [ -n "$target" ]; then
            export AUTH_USER_FILE="${target}vorschau/.htpasswd"
          else
            export AUTH_USER_FILE=".htpasswd"
          fi
          chmod +x ./scripts/build-hostpoint-vorschau.sh
          ./scripts/build-hostpoint-vorschau.sh
          if [ -n "${VORSCHAU_BASIC_USER:-}" ] && [ -n "${VORSCHAU_BASIC_PASSWORD:-}" ]; then
            hash="$(openssl passwd -apr1 "${VORSCHAU_BASIC_PASSWORD}")"
            printf '%s:%s\n' "${VORSCHAU_BASIC_USER}" "$hash" > deploy/hostpoint-vorschau/.htpasswd
            echo "HTTP-Zugang für /vorschau/ aus Repository-Secrets gesetzt."
          else
            echo "HTTP-Zugang für /vorschau/: Standard aus deploy/vorschau.htpasswd (bitte nach dem Launch ändern)."
          fi

      - name: Secrets und SSH-Host prüfen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          fail=0

          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::Secret SSH_HOST fehlt oder ist leer."
            fail=1
          else
            # Häufige Fehlereinträge bereinigen (nur zur Prüfung)
            host="${SSH_HOST}"
            host="${host#"${host%%[![:space:]]*}"}"
            host="${host%"${host##*[![:space:]]}"}"
            host="${host#sftp://}"
            host="${host#ssh://}"
            host="${host#https://}"
            host="${host#http://}"
            host="${host%%/*}"
            host="${host%%:*}"

            echo "Prüfe SSH_HOST (bereinigt, ohne Secret-Wert zu loggen)…"
            if [ -z "$host" ]; then
              echo "::error::SSH_HOST ist nach Bereinigung leer. Erwartet z. B. www.hvwinterthur.ch oder xyz.hostpoint.ch"
              fail=1
            elif ! getent hosts "$host" >/dev/null 2>&1; then
              if ! dig +short "$host" A | grep -q .; then
                echo "::error::Hostname ist nicht auflösbar (DNS). Secret SSH_HOST prüfen: nur Hostname, kein sftp://, kein Pfad, keine Leerzeichen."
                fail=1
              else
                echo "OK: SSH_HOST ist per DNS auflösbar."
              fi
            else
              echo "OK: SSH_HOST ist auflösbar."
            fi
          fi

          if [ -z "${SSH_USER:-}" ]; then
            echo "::error::Secret SSH_USER fehlt oder ist leer."
            fail=1
          else
            echo "OK: SSH_USER ist gesetzt."
          fi

          if [ -z "${SSH_TARGET_DIR:-}" ]; then
            echo "::error::Secret SSH_TARGET_DIR fehlt oder ist leer (Document Root mit / am Ende)."
            fail=1
          else
            echo "OK: SSH_TARGET_DIR ist gesetzt."
          fi

          key_len=${#SSH_PRIVATE_KEY}
          if [ "$key_len" -lt 200 ]; then
            echo "::error::SSH_PRIVATE_KEY scheint ungültig (nur ${key_len} Zeichen). Den kompletten privaten Key einfügen, inkl. BEGIN-/END-Zeilen. Nicht den öffentlichen Key (.pub)."
            fail=1
          elif ! printf '%s\n' "$SSH_PRIVATE_KEY" | grep -qE 'BEGIN .*PRIVATE KEY'; then
            echo "::error::SSH_PRIVATE_KEY enthält keinen «BEGIN … PRIVATE KEY»-Block."
            fail=1
          else
            echo "OK: SSH_PRIVATE_KEY sieht nach einem Private Key aus (${key_len} Zeichen)."
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Siehe README → Abschnitt «Deploy auf Hostpoint (GitHub Actions)»."
            exit 1
          fi

      - name: Soft-Launch per rsync auf Hostpoint übertragen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # Hostname bereinigen (falls versehentlich mit Protokoll gespeichert)
          host="${SSH_HOST}"
          host="${host#"${host%%[![:space:]]*}"}"
          host="${host%"${host##*[![:space:]]}"}"
          host="${host#sftp://}"; host="${host#ssh://}"
          host="${host#https://}"; host="${host#http://}"
          host="${host%%/*}"; host="${host%%:*}"

          target="${SSH_TARGET_DIR}"
          case "$target" in
            */) ;;
            *) target="${target}/" ;;
          esac

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          keyfile=$(mktemp)

          # Windows-CRLF aus dem Secret entfernen (sonst schlägt OpenSSH oft fehl)
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$keyfile"
          # Abschliessendes Newline sicherstellen
          [ -n "$(tail -c1 "$keyfile")" ] && echo >> "$keyfile"
          chmod 600 "$keyfile"

          echo "Verbindung: ${SSH_USER}@${host}:${target}"
          echo "Private-Key Zeilen: $(wc -l < "$keyfile")"
          if ssh-keygen -y -f "$keyfile" >/tmp/deploy.pub 2>/tmp/deploy.pub.err; then
            echo "Öffentlicher Key (aus Secret abgeleitet):"
            cat /tmp/deploy.pub
            echo "Fingerprint:"
            ssh-keygen -lf /tmp/deploy.pub
          else
            echo "::error::Private Key lässt sich nicht lesen. Secret SSH_PRIVATE_KEY prüfen."
            cat /tmp/deploy.pub.err || true
            rm -f "$keyfile"
            exit 1
          fi

          ssh-keyscan -p 22 -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "SSH-Verbindung testen…"
          if ! ssh -vvv -i "$keyfile" -p 22 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o PreferredAuthentications=publickey \
              "${SSH_USER}@${host}" 'echo OK' 2>/tmp/ssh-debug.log; then
            echo "::error::SSH Permission denied für ${SSH_USER}@${host}."
            echo "Prüfen: Secret SSH_USER = Hostpoint-Account (z. B. zozuhosa → exakt wie im Control Panel),"
            echo "SSH_HOST = Server-Hostname aus «Server Übersicht» (z. B. sl45.web.hostpoint.ch),"
            echo "und dass der Fingerprint oben mit dem Key in Hostpoint übereinstimmt."
            echo "--- ssh debug (Auszug) ---"
            grep -E 'Offering|Authentications|Permission|identity file|Trying' /tmp/ssh-debug.log || tail -40 /tmp/ssh-debug.log
            rm -f "$keyfile"
            exit 1
          fi


          echo "rsync Soft-Launch → ${SSH_USER}@${host}:${target}"
          # coucou_export.json / mus_export.json werden vom Hostpoint-Cron
          # (cronjobs/) erzeugt und dürfen durch Soft-Launch-Deploys nicht
          # gelöscht werden. /vorschau/ ist die interne Website-Vorschau.
          rsync -avz --delete \
            --exclude 'coucou_export.json' \
            --exclude 'mus_export.json' \
            --exclude 'home-events.json' \
            --exclude 'vorschau/' \
            -e "ssh -i ${keyfile} -p 22 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            deploy/hostpoint-soft-launch/ \
            "${SSH_USER}@${host}:${target}"

          echo "rsync interne Vorschau → ${SSH_USER}@${host}:${target}vorschau/"
          rsync -avz --delete \
            --exclude 'data/content-live.json' \
            --exclude 'redaktion/storage/content-draft.json' \
            --exclude 'redaktion/config.local.php' \
            -e "ssh -i ${keyfile} -p 22 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            deploy/hostpoint-vorschau/ \
            "${SSH_USER}@${host}:${target}vorschau/"

          rsync -avz --ignore-existing \
            -e "ssh -i ${keyfile} -p 22 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            deploy/hostpoint-vorschau/data/content-live.json \
            "${SSH_USER}@${host}:${target}vorschau/data/content-live.json"

          ssh -i "$keyfile" -p 22 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${SSH_USER}@${host}" \
            "mkdir -p '${target}vorschau/data' '${target}vorschau/redaktion/storage' && chmod u+rwX '${target}vorschau/data' '${target}vorschau/redaktion/storage' && chmod u+rw '${target}vorschau/data/content-live.json' 2>/dev/null || true"

          rm -f "$keyfile"
          echo "Deploy abgeschlossen (Soft-Launch + /vorschau/)."
