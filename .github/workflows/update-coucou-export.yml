# Täglich: Eventfrog → coucou_export.json → Hostpoint (www.hvwinterthur.ch)
#
# Ersetzt den Plesk-Cron auf giger-straehl.ch. Parallel kann derselbe Export
# lokal auf Hostpoint per Cronjobs Manager laufen (siehe cronjobs/README.md).
#
# Secrets: EVENTFROG_API_KEY, SSH_PRIVATE_KEY, SSH_HOST, SSH_USER, SSH_TARGET_DIR

name: Update Coucou export

on:
  schedule:
    # 03:15 UTC ≈ 05:15 CH-Sommerzeit / 04:15 Winterzeit
    - cron: '15 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: coucou-export-hostpoint
  cancel-in-progress: true

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r cronjobs/requirements.txt

      - name: Generate coucou_export.json
        env:
          EVENTFROG_API_KEY: ${{ secrets.EVENTFROG_API_KEY }}
          HVW_HTTPDOCS_DIR: ${{ github.workspace }}/deploy/coucou-out
          HVW_WRITE_HOME_EVENTS: '0'
        run: |
          set -euo pipefail
          if [ -z "${EVENTFROG_API_KEY:-}" ]; then
            echo "::error::Secret EVENTFROG_API_KEY fehlt."
            exit 1
          fi
          mkdir -p "$HVW_HTTPDOCS_DIR"
          python cronjobs/eventfrog_to_coucou.py
          test -s "$HVW_HTTPDOCS_DIR/coucou_export.json"
          echo "Export-Größe: $(wc -c < "$HVW_HTTPDOCS_DIR/coucou_export.json") Bytes"

      - name: Upload coucou_export.json to Hostpoint
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          host="${SSH_HOST}"
          host="${host#"${host%%[![:space:]]*}"}"
          host="${host%"${host##*[![:space:]]}"}"
          host="${host#sftp://}"; host="${host#ssh://}"
          host="${host#https://}"; host="${host#http://}"
          host="${host%%/*}"; host="${host%%:*}"

          target="${SSH_TARGET_DIR}"
          case "$target" in
            */) ;;
            *) target="${target}/" ;;
          esac

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          keyfile=$(mktemp)
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$keyfile"
          [ -n "$(tail -c1 "$keyfile")" ] && echo >> "$keyfile"
          chmod 600 "$keyfile"
          ssh-keyscan -p 22 -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true

          rsync -avz \
            -e "ssh -i ${keyfile} -p 22 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            deploy/coucou-out/coucou_export.json \
            "${SSH_USER}@${host}:${target}coucou_export.json"

          rm -f "$keyfile"
          echo "coucou_export.json → ${SSH_USER}@${host}:${target}"
