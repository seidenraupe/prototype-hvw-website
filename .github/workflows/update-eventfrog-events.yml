name: Update Eventfrog homepage events

on:
  schedule:
    # Täglich um 05:00 UTC — Events ändern sich selten, häufigere Abfragen
    # sind laut Eventfrog-API-Dokumentation nicht nötig und würden unnötig
    # das Rate-Limit des API-Keys belasten.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest events from Eventfrog
        env:
          EVENTFROG_API_KEY: ${{ secrets.EVENTFROG_API_KEY }}
        run: node scripts/fetch-eventfrog-events.mjs

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/home-events.json; then
            echo "No changes to data/home-events.json"
          else
            git add data/home-events.json
            git commit -m "chore: update homepage events from Eventfrog"
            git push
          fi
